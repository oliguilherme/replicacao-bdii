services:
  mysql-master:
    image: mysql:8.4
    container_name: mysql-master
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3306:3306"

    volumes:
      - master_data:/var/lib/mysql
      - ./master/my.cnf:/etc/mysql/conf.d/my.cnf

    networks:
      - replication

  mysql-slave:
    image: mysql:8.4
    container_name: mysql-slave
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3307:3306"

    volumes:
      - slave_data:/var/lib/mysql
      - ./slave/my.cnf:/etc/mysql/conf.d/my.cnf

    depends_on:
      - mysql-master

    networks:
      - replication

volumes:
  master_data:
  slave_data:

networks:
  replication:
    driver: bridge
